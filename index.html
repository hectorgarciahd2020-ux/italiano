<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#fff">
<title>Italiano Fácil</title>
<style>
:root{font-size:20px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;line-height:1.55;background:white;color:#111}
header{text-align:center;padding:18px;border-bottom:2px solid #111}h1{font-size:2rem;margin:0}h2{font-size:1.5rem}
main{max-width:1000px;margin:auto;padding:16px}.card{border:2px solid #111;border-radius:14px;padding:16px;margin:14px 0}
button{font-size:1rem;padding:12px 16px;margin:5px;border:2px solid #111;border-radius:10px;background:white;color:#111}
button:disabled{opacity:.6}.nav{display:flex;flex-wrap:wrap;justify-content:center}.lesson{display:none}.lesson.active{display:block}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #111;padding:8px;text-align:left}.italian{font-weight:bold}.big{font-size:1.25rem}
.option{display:block;width:100%;text-align:left}.status{border:2px dashed #111;border-radius:10px;padding:10px;margin:10px 0}
</style></head><body>
<header><h1>🇮🇹 Italiano Fácil</h1><div class="big">Curso práctico de italiano</div>
<div class="nav"><button onclick="font(2)">Aumentar letra</button><button onclick="font(-2)">Reducir letra</button>
<button onclick="contrast()">Alto contraste</button><button id="install" hidden>Instalar aplicación</button></div></header>
<main><div class="card"><b id="prog"></b><p>Elige cualquier capítulo. Puedes repetirlos y cambiar de capítulo libremente.</p><div id="nav" class="nav"></div></div>
<div id="audio" class="status">Audio: comprobando voces italianas...</div><div id="app"></div></main>
<script>
const L=[
["1. Alfabeto y sonidos",[["A","a"],["B","bi"],["C","ci"],["D","di"],["E","e"],["F","effe"],["G","gi"],["H","acca"],["I","i"],["L","elle"],["M","emme"],["N","enne"],["O","o"],["P","pi"],["Q","cu"],["R","erre"],["S","esse"],["T","ti"],["U","u"],["V","vi"],["Z","zeta"]]],
["2. Saludos y cortesía",[["Buongiorno","Buenos días"],["Buonasera","Buenas tardes/noches"],["Ciao","Hola / Adiós"],["Arrivederci","Hasta luego"],["Per favore","Por favor"],["Grazie","Gracias"],["Prego","De nada"],["Scusi","Disculpe"],["Come sta?","¿Cómo está?"],["Bene, grazie.","Bien, gracias."]]],
["3. Presentarse",[["Mi chiamo...","Me llamo..."],["Sono...","Soy..."],["Piacere!","¡Mucho gusto!"],["Da dove viene?","¿De dónde es?"],["Vengo dalla Spagna.","Vengo de España."],["Abito in Italia.","Vivo en Italia."]]],
["4. Números",[["uno","1"],["due","2"],["tre","3"],["quattro","4"],["cinque","5"],["sei","6"],["sette","7"],["otto","8"],["nove","9"],["dieci","10"],["venti","20"],["trenta","30"],["cento","100"],["mille","1000"]]],
["5. Edad y familia",[["Quanti anni ha?","¿Cuántos años tiene?"],["Ho sessant'anni.","Tengo sesenta años."],["la famiglia","la familia"],["il marito","el marido"],["la moglie","la esposa"],["il figlio","el hijo"],["la figlia","la hija"],["il fratello","el hermano"],["la sorella","la hermana"]]],
["6. La casa",[["la casa","la casa"],["la cucina","la cocina"],["il bagno","el baño"],["la camera","el dormitorio"],["il soggiorno","el salón"],["la porta","la puerta"],["la finestra","la ventana"],["il tavolo","la mesa"],["la sedia","la silla"],["il letto","la cama"]]],
["7. Comida y restaurante",[["Vorrei...","Quisiera..."],["Un caffè, per favore.","Un café, por favor."],["Un bicchiere d'acqua.","Un vaso de agua."],["Il menù, per favore.","El menú, por favor."],["Quanto costa?","¿Cuánto cuesta?"],["Il conto, per favore.","La cuenta, por favor."],["È buonissimo!","¡Está buenísimo!"],["senza","sin"],["con","con"]]],
["8. Artículos y género",[["il libro","el libro"],["lo zaino","la mochila"],["l'amico","el amigo"],["la casa","la casa"],["i libri","los libros"],["gli amici","los amigos"],["le case","las casas"],["un caffè","un café"],["una pizza","una pizza"]]],
["9. Essere y avere",[["io sono","yo soy / estoy"],["tu sei","tú eres / estás"],["lui/lei è","él/ella es / está"],["noi siamo","nosotros somos / estamos"],["voi siete","vosotros sois / estáis"],["loro sono","ellos son / están"],["io ho","yo tengo"],["tu hai","tú tienes"],["lui/lei ha","él/ella tiene"],["noi abbiamo","nosotros tenemos"],["voi avete","vosotros tenéis"],["loro hanno","ellos tienen"]]],
["10. Presente",[["io parlo","yo hablo"],["tu parli","tú hablas"],["lui/lei parla","él/ella habla"],["noi parliamo","nosotros hablamos"],["voi parlate","vosotros habláis"],["loro parlano","ellos hablan"],["io mangio","yo como"],["tu mangi","tú comes"],["lui/lei mangia","él/ella come"],["noi mangiamo","nosotros comemos"]]],
["11. Pasado",[["Ho mangiato.","He comido."],["Ho parlato.","He hablado."],["Ho lavorato.","He trabajado."],["Sono andato/andata.","He ido."],["Ho visto.","He visto."],["Ho comprato.","He comprado."],["Ieri","ayer"],["stamattina","esta mañana"],["la settimana scorsa","la semana pasada"]]],
["12. Futuro",[["Domani andrò.","Mañana iré."],["Farò una passeggiata.","Daré un paseo."],["Mangerò a casa.","Comeré en casa."],["Vedrò un amico.","Veré a un amigo."],["Partirò domani.","Saldré mañana."],["La prossima settimana","La próxima semana"],["più tardi","más tarde"]]],
["13. Preguntas y negación",[["Dove?","¿Dónde?"],["Quando?","¿Cuándo?"],["Come?","¿Cómo?"],["Perché?","¿Por qué?"],["Quanto?","¿Cuánto?"],["Che cosa?","¿Qué?"],["Non capisco.","No entiendo."],["Non lo so.","No lo sé."],["Può ripetere?","¿Puede repetir?"]]],
["14. Conversaciones cotidianas",[["Buongiorno, come sta?","Bien, gracias. ¿Y usted?"],["Vorrei un caffè e un cornetto.","Certamente."],["Quanto costa?","Costa cinque euro."],["Dov'è la stazione?","È vicino, a cinque minuti da qui."],["Mi può aiutare?","Sì, certamente."]]],
["15. Compras",[["Vorrei comprare...","Quisiera comprar..."],["Quanto costa questo?","¿Cuánto cuesta esto?"],["Avete una taglia più grande?","¿Tienen una talla más grande?"],["Posso pagare con la carta?","¿Puedo pagar con tarjeta?"],["È troppo caro.","Es demasiado caro."],["Va bene.","Está bien."]]],
["16. Médico y farmacia",[["Ho bisogno di aiuto.","Necesito ayuda."],["Non mi sento bene.","No me siento bien."],["Dov'è la farmacia?","¿Dónde está la farmacia?"],["Ho bisogno di una medicina.","Necesito un medicamento."],["Ho un appuntamento.","Tengo una cita."],["Può parlare più lentamente?","¿Puede hablar más despacio?"]]],
["17. Transporte y direcciones",[["Dov'è la stazione?","¿Dónde está la estación?"],["Come posso arrivare?","¿Cómo puedo llegar?"],["a destra","a la derecha"],["a sinistra","a la izquierda"],["sempre dritto","todo recto"],["vicino","cerca"],["lontano","lejos"],["la fermata","la parada"]]],
["18. Repaso general",[["Come si dice...?","¿Cómo se dice...?"],["Come si pronuncia?","¿Cómo se pronuncia?"],["Non ho capito.","No he entendido."],["Può parlare lentamente?","¿Puede hablar lentamente?"],["Può scriverlo?","¿Puede escribirlo?"],["Grazie per il suo aiuto.","Gracias por su ayuda."],["Arrivederci e buona giornata!","¡Hasta luego y que tenga un buen día!"]]]
];
let done=JSON.parse(localStorage.done||"[]"),pts=+localStorage.pts||0,fs=+localStorage.fs||20;
document.documentElement.style.fontSize=fs+"px";
function speak(t){let vs=speechSynthesis.getVoices(),v=vs.find(x=>/^it(-|_)/i.test(x.lang))||vs.find(x=>/ital/i.test(x.name));
document.getElementById("audio").textContent=v?"Audio listo: se encontró una voz italiana.":"Audio: no se encontró una voz italiana. Prueba Chrome o Edge y revisa las voces de texto a voz del dispositivo.";
let u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:"it-IT";if(v)u.voice=v;u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)}
function checkVoice(){let v=speechSynthesis.getVoices();document.getElementById("audio").textContent=v.some(x=>/^it(-|_)/i.test(x.lang)||/ital/i.test(x.name))?"Audio listo: voz italiana encontrada. Pulsa 🔊 para escuchar.":"Audio: no se encontró una voz italiana. Prueba Chrome o Edge y revisa las voces de texto a voz del dispositivo."}
speechSynthesis.onvoiceschanged=checkVoice;setTimeout(checkVoice,700);
function font(n){fs=Math.max(16,Math.min(34,fs+n));document.documentElement.style.fontSize=fs+"px";localStorage.fs=fs}
function contrast(){document.body.style.background=document.body.style.background==="black"?"white":"black";document.body.style.color=document.body.style.color==="white"?"#111":"white"}
function show(i){document.querySelectorAll(".lesson").forEach(x=>x.classList.remove("active"));document.getElementById("l"+i).classList.add("active");localStorage.last=i;scrollTo(0,0)}
function finish(i){if(!done.includes(i)){done.push(i);pts+=20;localStorage.done=JSON.stringify(done);localStorage.pts=pts}render();show(i)}
function answer(b,ok){b.parentElement.querySelectorAll("button").forEach(x=>x.disabled=true);b.textContent=ok?"✓ Correcto":"✗ Incorrecto";if(ok){pts+=10;localStorage.pts=pts}renderProg()}
function renderProg(){document.getElementById("prog").textContent=`Lecciones completadas: ${done.length}/${L.length} · Puntos: ${pts}`}
function render(){let nav=document.getElementById("nav"),app=document.getElementById("app");nav.innerHTML="";app.innerHTML="";
L.forEach((x,i)=>{let b=document.createElement("button");b.textContent=(done.includes(i)?"✓ ":"")+(i+1);b.title=done.includes(i)?"Capítulo completado. Puedes volver a estudiarlo cuando quieras.":"Abrir capítulo "+(i+1);b.onclick=()=>show(i);nav.appendChild(b);
let s=document.createElement("section");s.id="l"+i;s.className="lesson";s.innerHTML=`<div class="card"><h2>${x[0]}</h2><p class="big">${i===0?"Aprende paso a paso. Cada palabra tiene un botón de audio.": "Practica y escucha las frases en italiano."}</p><table><tr><th>Italiano</th><th>Español</th><th>Audio</th></tr>`;
x[1].forEach(w=>s.innerHTML+=`<tr><td class="italian">${w[0]}</td><td>${w[1]}</td><td><button onclick='speak(${JSON.stringify(w[0])})'>🔊 Escuchar</button></td></tr>`);
s.innerHTML+=`</table><h3>Mini ejercicio</h3><p>¿Qué significa <b>${x[1][0][0]}</b>?</p><button class="option" onclick="answer(this,true)">${x[1][0][1]}</button><button class="option" onclick="answer(this,false)">Mañana</button><button class="option" onclick="answer(this,false)">Gracias</button><br><button onclick="finish(${i})">${done.includes(i)?"✓ Capítulo completado":"✓ Marcar capítulo como completado"}</button><p class="status">${done.includes(i)?"Este capítulo está marcado como completado, pero puedes estudiarlo de nuevo todas las veces que quieras.":"Puedes marcarlo como completado cuando tú decidas. No se marca automáticamente."}</p></div>`;
app.appendChild(s)});renderProg();show(+localStorage.last||0)}
render();
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;install.hidden=false});
install.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;install.hidden=true}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
